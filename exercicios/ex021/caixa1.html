<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {

            
            background-color: lightgrey;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;

            padding: 10px auto 20px auto;

            margin:auto;

            outline-width: 10px;
            outline-style: dashed;
            outline-color: salmon;;
        }

        a {
            
            border-width: 10px;
            border-style: solid;
            border-color: red;

            padding: 10px auto 20px auto;
        
            
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa em box-level</h1>
    <p>Parágrafos também são exmeplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level. </a>Vamoa ver como isso funciona.</p>
</body>
</html>
