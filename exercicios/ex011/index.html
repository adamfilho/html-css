<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <picture>
        <source media="(max-width: 750px)" srcset="paisagemP.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="paisagemM.png" type="image/png">
        <img src="paisagemG.png" alt="Paisagem">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Vamos parender a produzir audio no HTML 5</p>
    <audio preloaded="metadata" controls autoplay >
        <source src="audio.mp3" type="audio/png">
    </audio>
    <p>Baixe o audio <a href="audio.mp3">musica</a></p>
</body>
</html>
